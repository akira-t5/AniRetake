<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>シート通信の確認</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #2c2c2b; background: #fff; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
      button { margin: 16px 8px 0 0; padding: 8px 16px; font-size: 14px; cursor: pointer; }
      pre { background: #f3f2f0; padding: 12px; white-space: pre-wrap; word-break: break-all; min-height: 4em; }
      .ok { color: #1e7a46; font-weight: 700; }
      .ng { color: #c0392b; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>シート通信の確認（開発用）</h1>
    <p>開き方：<b id="proto"></b></p>
    <label for="url">ウェブアプリの URL（…/exec で終わるもの）</label>
    <input id="url" placeholder="https://script.google.com/macros/s/…/exec" />
    <label for="key">合言葉（probe.gs の KEY と同じ）</label>
    <input id="key" value="test-aikotoba" />
    <button id="get">① 受け取りテスト（GET）</button>
    <button id="post">② 書き込みテスト（POST）</button>
    <h2>結果</h2>
    <pre id="out">まだ試していません</pre>
    <script>
      const $ = (id) => document.getElementById(id);
      const from = location.protocol === "file:" ? "ファイルを直接開いた（file://）" : location.origin;
      $("proto").textContent = from;
      try {
        $("url").value = localStorage.getItem("probeUrl") || "";
      } catch (e) {}
      const show = (ok, text) => {
        $("out").innerHTML = `<span class="${ok ? "ok" : "ng"}">${ok ? "成功" : "失敗"}</span>\n` + text.replace(/</g, "&lt;");
      };
      async function run(method) {
        const url = $("url").value.trim(),
          key = $("key").value;
        if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) return show(false, "URL の形が違います。…/exec で終わる URL を貼ってください。");
        try {
          localStorage.setItem("probeUrl", url);
        } catch (e) {}
        $("out").textContent = "通信中…";
        const t0 = performance.now();
        try {
          const res =
            method === "GET"
              ? await fetch(url + "?key=" + encodeURIComponent(key))
              : await fetch(url, {
                  method: "POST",
                  headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify({ key, from, message: "テスト " + new Date().toLocaleString() }),
                });
          const ms = Math.round(performance.now() - t0);
          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            return show(false, `応答が JSON ではありません（${ms}ms）。デプロイの「アクセスできるユーザー」が「全員」になっているか確認してください。\n\n${text.slice(0, 500)}`);
          }
          show(!!data.ok, `${ms}ms\n` + JSON.stringify(data, null, 2));
        } catch (e) {
          show(false, `通信できませんでした（${e.message}）。\nこの開き方ではブラウザが通信を止めている可能性があります。この結果をそのまま開発者に送ってください。`);
        }
      }
      $("get").onclick = () => run("GET");
      $("post").onclick = () => run("POST");
    </script>
  </body>
</html>
